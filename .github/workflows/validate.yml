name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-Setup.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\scripts\Test-Setup.ps1
      - name: Package reviewed public files
        shell: pwsh
        run: .\scripts\New-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: power-platform-setup-windows
          path: |
            dist/power-platform-setup-windows.zip
            dist/power-platform-setup-windows.zip.sha256
          if-no-files-found: error

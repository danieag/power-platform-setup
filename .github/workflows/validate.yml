name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and run non-installing regression tests
        shell: ${{ matrix.shell }}
        run: .\scripts\Test-Setup.ps1
      - name: Package reviewed public files
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\New-Release.ps1
      - uses: actions/upload-artifact@v4
        if: matrix.shell == 'pwsh'
        with:
          name: power-platform-setup-windows
          path: |
            dist/power-platform-setup-windows.zip
            dist/power-platform-setup-windows.zip.sha256
          if-no-files-found: error
